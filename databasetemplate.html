<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanilla JS Datatable — uiCookies</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f9;padding:28px;color:#1a2233}
.wrap{width:100%;max-width:820px;background:#fff;border:1px solid #e6eaf1;border-radius:16px;padding:24px;box-shadow:0 14px 34px -18px rgba(20,28,45,.16)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:1.05rem;letter-spacing:-.01em}
h1 span{color:#8a94a8;font-weight:500;font-size:.85rem;margin-left:8px}
input[type=search]{padding:9px 14px;border:1px solid #d6dce7;border-radius:10px;font-size:.88rem;width:230px;transition:border-color .15s,box-shadow .15s}
input[type=search]:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.14)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.73rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#67718a;padding:11px 14px;border-bottom:2px solid #eef1f7;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:#1a2233}
th .dir{opacity:.45;margin-left:5px;font-size:.7rem}
th.on .dir{opacity:1;color:#3b82f6}
td{padding:12px 14px;border-bottom:1px solid #f1f4f9}
tbody tr:hover{background:#f8fafd}
.who{font-weight:600}
.who small{display:block;font-weight:400;color:#8a94a8}
.badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px}
.Paid{background:#e7f8ee;color:#177a45}.Pending{background:#fff4e0;color:#9a6a12}.Overdue{background:#fdeaea;color:#b42323}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:.82rem;color:#67718a;flex-wrap:wrap;gap:12px}
.pages{display:flex;gap:6px}
.pages button{min-width:32px;height:32px;border:1px solid #d6dce7;background:#fff;border-radius:8px;font-size:.82rem;font-weight:600;color:#3c4658;cursor:pointer;transition:background .15s}
.pages button:hover{background:#f1f5fb}
.pages button.cur{background:#1a2233;border-color:#1a2233;color:#fff}
.pages button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Invoices <span id="count"></span></h1>
    <input type="search" id="q" placeholder="Search client or number…" aria-label="Search table">
  </div>
  <table id="tbl">
    <thead><tr>
      <th data-k="num">Invoice <span class="dir">↕</span></th>
      <th data-k="client">Client <span class="dir">↕</span></th>
      <th data-k="amount">Amount <span class="dir">↕</span></th>
      <th data-k="date">Issued <span class="dir">↕</span></th>
      <th data-k="status">Status <span class="dir">↕</span></th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <div class="foot"><span id="info"></span><div class="pages" id="pages"></div></div>
</div>
<script>
const DATA = [
  {num:'INV-1041',client:'Arcadia Labs',email:'billing@arcadia.io',amount:2400,date:'2026-06-28',status:'Paid'},
  {num:'INV-1040',client:'Fieldnote',email:'ap@fieldnote.co',amount:860,date:'2026-06-26',status:'Pending'},
  {num:'INV-1039',client:'Northwind',email:'pay@northwind.dev',amount:5300,date:'2026-06-21',status:'Paid'},
  {num:'INV-1038',client:'Corvid Analytics',email:'fin@corvid.ai',amount:1275,date:'2026-06-18',status:'Overdue'},
  {num:'INV-1037',client:'Meridian',email:'ap@meridian.app',amount:990,date:'2026-06-15',status:'Paid'},
  {num:'INV-1036',client:'Bluewater Co',email:'acc@bluewater.se',amount:3150,date:'2026-06-11',status:'Pending'},
  {num:'INV-1035',client:'Hexagon Press',email:'money@hexpress.com',amount:410,date:'2026-06-07',status:'Paid'},
  {num:'INV-1034',client:'Solstice',email:'billing@solstice.fm',amount:2790,date:'2026-06-03',status:'Overdue'},
  {num:'INV-1033',client:'Papergrain',email:'ap@papergrain.jp',amount:1580,date:'2026-05-29',status:'Paid'},
  {num:'INV-1032',client:'Vantage Point',email:'pay@vantage.pt',amount:720,date:'2026-05-24',status:'Paid'},
  {num:'INV-1031',client:'Driftwood',email:'fin@driftwood.nz',amount:1940,date:'2026-05-20',status:'Pending'},
  {num:'INV-1030',client:'Lumen Works',email:'ap@lumen.works',amount:4460,date:'2026-05-16',status:'Paid'},
];
const PER = 5;
let page = 1, sortK = 'num', sortDir = -1, query = '';
const money = (n) => '$' + n.toLocaleString();
function view(){
  let rows = DATA.filter(r => (r.client + r.num).toLowerCase().includes(query));
  rows.sort((a,b) => (a[sortK] > b[sortK] ? 1 : a[sortK] < b[sortK] ? -1 : 0) * sortDir);
  const total = rows.length, maxPage = Math.max(1, Math.ceil(total / PER));
  if (page > maxPage) page = maxPage;
  const slice = rows.slice((page-1)*PER, page*PER);
  document.querySelector('#tbl tbody').innerHTML = slice.map(r =>
    `<tr><td>${r.num}</td><td class="who">${r.client}<small>${r.email}</small></td><td>${money(r.amount)}</td><td>${r.date}</td><td><span class="badge ${r.status}">${r.status}</span></td></tr>`
  ).join('') || '<tr><td colspan="5" style="text-align:center;color:#8a94a8;padding:26px">No matches.</td></tr>';
  document.getElementById('count').textContent = total + ' total';
  document.getElementById('info').textContent = total ? `Showing ${(page-1)*PER+1}–${Math.min(page*PER,total)} of ${total}` : '';
  document.getElementById('pages').innerHTML =
    `<button ${page===1?'disabled':''} onclick="page--;view()">‹</button>` +
    Array.from({length:maxPage},(_,i)=>`<button class="${i+1===page?'cur':''}" onclick="page=${i+1};view()">${i+1}</button>`).join('') +
    `<button ${page===maxPage?'disabled':''} onclick="page++;view()">›</button>`;
}
document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = 1; }
  document.querySelectorAll('th').forEach(x => x.classList.toggle('on', x === th));
  view();
}));
document.getElementById('q').addEventListener('input', e => { query = e.target.value.toLowerCase(); page = 1; view(); });
view();
</script>
</body>
</html>
